run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic

issues:
  exclude-rules:
    # Example and test code intentionally ignores constructor return values.
    - path: _test\.go
      linters:
        - errcheck
